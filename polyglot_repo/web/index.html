<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="top">
    <h1>Demo Shop</h1>
    <nav id="main-nav">
      <a href="#cart">Cart</a>
      <a href="#about">About</a>
    </nav>
  </header>
  <section id="cart">
    <h2>Your cart</h2>
    <ul id="cart-list"></ul>
  </section>
  <footer id="page-footer">
    <p>Demo only — nothing is for sale.</p>
  </footer>
  <script>
    function initCart() {
      const list = document.getElementById('cart-list');
      list.textContent = 'empty';
      console.log('cart ready');
    }
    document.addEventListener('DOMContentLoaded', initCart);
  </script>
</body>
</html>
